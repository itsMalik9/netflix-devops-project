
services:
  catalog-db:
    image: mongo:7
    volumes:
      - catalog-data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: netflix
      RABBITMQ_DEFAULT_PASS: netflix
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  catalog-service:
    build: ./services/catalog-service
    ports:
      - "3000:3000"
    environment:
      MONGO_URL: mongodb://catalog-db:27017/catalogdb
      RABBITMQ_URL: amqp://netflix:netflix@rabbitmq:5672
    depends_on:
      catalog-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - backend
      - api

  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth

    volumes:
      - auth-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  watchlist-service:
    build: ./services/watchlist-service
    ports:
      - "8082:8080"
    environment:
      ConnectionStrings__Default: Host=watchlist-db;Port=5432;Database=watchlistdb;Username=watchlist;Password=watchlist
      RabbitMq__Host: rabbitmq
      RabbitMq__User: netflix
      RabbitMq__Password: netflix
      Jwt__Secret: change-me-this-is-a-dev-secret-at-least-32-bytes
    depends_on:
      watchlist-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
      - api


  auth-service:
    build: ./services/auth-service
    ports:
      - "8081:8081"
    environment:
      DB_URL: jdbc:postgresql://auth-db:5432/authdb
      DB_USER: auth
      DB_PASSWORD: auth
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: netflix
      RABBITMQ_PASSWORD: netflix
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "-s", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - backend
      - api

  watchlist-db:
    image: postgres:16
    environment:
      POSTGRES_DB: watchlistdb
      POSTGRES_USER: watchlist
      POSTGRES_PASSWORD: watchlist
    volumes:
      - watchlist-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchlist -d watchlistdb"]
      interval: 10s
      timeout: 5s
      retries: 10

  media-db:
    image: postgres:16
    environment:
      POSTGRES_DB: mediadb
      POSTGRES_USER: media
      POSTGRES_PASSWORD: media
    volumes:
      - media-data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U media -d mediadb"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - backend
      - api

  media-service:
    build: ./services/media-service
    image: netflix-media:local
    ports:
      - "8000:8000"
    environment:
      DB_HOST: media-db
      DB_NAME: mediadb
      DB_USER: media
      DB_PASSWORD: media
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: netflix-media
      RABBITMQ_URL: amqp://netflix:netflix@rabbitmq:5672
      JWT_SECRET: change-me-this-is-a-dev-secret-at-least-32-bytes
    depends_on:
      media-init:
        condition: service_completed_successfully
      media-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
      - api
  media-worker:
    build: ./services/media-service
    image: netflix-media:local
    command: python manage.py consume_events
    environment:
      DB_HOST: media-db
      DB_NAME: mediadb
      DB_USER: media
      DB_PASSWORD: media
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: netflix-media
      RABBITMQ_URL: amqp://netflix:netflix@rabbitmq:5672
    depends_on:
      media-init:
        condition: service_completed_successfully
      media-service:
        condition: service_started
      media-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - backend

  shell:
    build: ./frontends/shell
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - frontend


  mfe-auth:
    build: ./frontends/mfe-auth
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - frontend

  mfe-browse:
    build: ./frontends/mfe-browse
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - frontend

  studio:
    build: ./frontends/studio
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/studio"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - frontend

  gateway:
    build: ./gateway
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/gateway/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - frontend
      - api
  media-init:
    build: ./services/media-service
    image: netflix-media:local
    entrypoint: ["/bin/sh", "/media-service/entrypoint.sh"]
    command: ["true"]
    environment:
      DB_HOST: media-db
      DB_NAME: mediadb
      DB_USER: media
      DB_PASSWORD: media
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: netflix-media
      RABBITMQ_URL: amqp://netflix:netflix@rabbitmq:5672
    depends_on:
      media-db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - backend
volumes:
  catalog-data:
  rabbitmq-data:
  auth-data:
  watchlist-data:
  media-data:
  minio-data:

networks:
  backend:
  frontend:
  api:
